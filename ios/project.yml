name: Menia
options:
  bundleIdPrefix: ch.menia
  deploymentTarget:
    iOS: '18.0'
packages:
  MeniaKit:
    path: MeniaKit
targets:
  Menia:
    type: application
    platform: iOS
    sources: [MeniaApp]
    dependencies:
      - package: MeniaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.menia.local
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
