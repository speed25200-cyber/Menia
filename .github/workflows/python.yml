name: Python core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_agent_artifacts.py
      - run: python scripts/check_agency_discovery_artifacts.py
      - run: python research/audit_plasticity_realization.py --output artifacts/plasticity-realization-audit/report.json --check
      - run: python research/audit_evidence_weighting.py --output artifacts/evidence-weighting-audit/report.json --check
      - run: python research/audit_projective_representation.py --output artifacts/projective-representation-audit/report.json --check
      - run: python -m research.audit_temporal_bridge --check
      - run: python -m research.audit_reflexive_self --check
      - run: python -m compileall -q menia tests scripts
      - run: python scripts/check_notebook.py

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests_research -v
      - run: python scripts/check_recurrent_artifacts.py
      - run: python -m research.audit_origin --root artifacts/origin-inquiry
      - run: python -m research.audit_origin_rl --root artifacts/learned-inquiry --replay-lives 10
      - run: python -m research.audit_own_action --root artifacts/own-action-channel --mutable-root artifacts/own-action-mutable --check --replay-lives 1
      - run: python -m research.llm_body_verdicts --latent artifacts/llm-latent-mac/run-1 --check artifacts/llm-latent-mac/run-1/verdicts.json
      - run: python -m research.llm_body_verdicts --latent artifacts/llm-latent-mac/run-2 --check artifacts/llm-latent-mac/run-2/verdicts.json
      - run: python -m research.llm_body_verdicts --lora artifacts/llm-lora-mac/run-3-f artifacts/llm-lora-mac/run-3-vm --check artifacts/llm-lora-mac/verdicts-run-3.json
      - run: python -m research.llm_body_verdicts --lora artifacts/llm-lora-mac/run-4-vm artifacts/llm-lora-mac/run-3-f --check artifacts/llm-lora-mac/verdicts-run-4.json
      - run: python -m research.llm_report verdicts --rows artifacts/llm-report/run-2/llm-report/rows.jsonl --check artifacts/llm-report/run-2/llm-report/summary.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-inquiry/run-1/llm-inquiry/VM --f artifacts/llm-inquiry/run-1/llm-inquiry/F --check artifacts/llm-inquiry/verdicts-run-1.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-inquiry/run-2/llm-inquiry/VM --f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-inquiry/verdicts-run-2.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-lora-mac/run-5-vmi/inquiry-VMI --f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-5-vmi.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-lora-mac/run-6-vmm/inquiry-VMM --f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-6-vmm.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-lora-mac/run-7-vmw/inquiry-VMW --f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-7-vmw.json
      - run: python -m research.llm_mark_use --check
      - run: python -m research.llm_mark_reading verdicts --reading F=artifacts/llm-lora-mac/run-8-vml/reading-F VM=artifacts/llm-lora-mac/run-8-vml/reading-VM VMI=artifacts/llm-lora-mac/run-8-vml/reading-VMI VMW=artifacts/llm-lora-mac/run-8-vml/reading-VMW VML=artifacts/llm-lora-mac/run-8-vml/reading-VML --inquiry-vml artifacts/llm-lora-mac/run-8-vml/inquiry-VML --inquiry-f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-8-vml.json
      - run: python -m research.llm_mark_reading hand --reading artifacts/llm-lora-mac/run-9-vmla/reading-VMLA --inquiry artifacts/llm-lora-mac/run-9-vmla/inquiry-VMLA --inquiry-f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-9-vmla.json
      - run: python -m research.llm_mark_reading long --baseline artifacts/llm-lora-mac/run-9-vmla/reading-VMLA --reading 850=artifacts/llm-lora-mac/run-10-vmla-long/reading-850 1100=artifacts/llm-lora-mac/run-10-vmla-long/reading-1100 1350=artifacts/llm-lora-mac/run-10-vmla-long/reading-1350 --check artifacts/llm-lora-mac/verdicts-run-10-vmla-long.json
      - run: python -m research.llm_inquiry_verdicts --vm artifacts/llm-lora-mac/run-11-seek/inquiry-VMLA-1350 --f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-11-seek.json
      - run: python -m research.llm_mark_reading full --reading 1600=artifacts/llm-lora-mac/run-12-full/reading-1600 1850=artifacts/llm-lora-mac/run-12-full/reading-1850 2100=artifacts/llm-lora-mac/run-12-full/reading-2100 --inquiry artifacts/llm-lora-mac/run-13-full-seek/inquiry-FULL-2100 --inquiry-f artifacts/llm-inquiry/run-2/llm-inquiry/F --check artifacts/llm-lora-mac/verdicts-run-12-full.json
      - run: python -m research.llm_mark_reading stage --preferred B --learned A --reading 2350=artifacts/llm-lora-mac/run-14-stage-b/reading-2350 2600=artifacts/llm-lora-mac/run-14-stage-b/reading-2600 2850=artifacts/llm-lora-mac/run-14-stage-b/reading-2850 --check artifacts/llm-lora-mac/verdicts-run-14-stage-b.json
      - run: python -m research.llm_mark_reading stage --preferred A --learned B --reading 3100=artifacts/llm-lora-mac/run-15-rehearsal/reading-3100 3350=artifacts/llm-lora-mac/run-15-rehearsal/reading-3350 3600=artifacts/llm-lora-mac/run-15-rehearsal/reading-3600 --check artifacts/llm-lora-mac/verdicts-run-15-rehearsal.json
      - run: python -m research.llm_mark_reading stage --preferred C --learned A B --reading 3850=artifacts/llm-lora-mac/run-16-rehearsal-c/reading-3850 4100=artifacts/llm-lora-mac/run-16-rehearsal-c/reading-4100 4350=artifacts/llm-lora-mac/run-16-rehearsal-c/reading-4350 --check artifacts/llm-lora-mac/verdicts-run-16-rehearsal-c.json
      - run: python -m research.llm_mark_reading stage --preferred D --learned A B C --reading 4600=artifacts/llm-lora-mac/run-17-rehearsal-d/reading-4600 4850=artifacts/llm-lora-mac/run-17-rehearsal-d/reading-4850 5100=artifacts/llm-lora-mac/run-17-rehearsal-d/reading-5100 --check artifacts/llm-lora-mac/verdicts-run-17-rehearsal-d.json
      - run: python -m research.llm_menia_report verdicts --rows artifacts/menia-report/run-1/menia-report/rows.jsonl --check artifacts/menia-report/run-1/menia-report/summary.json
      - run: python -m research.llm_menia_report verdicts --rows artifacts/menia-report/run-2/menia-report/rows.jsonl --check artifacts/menia-report/run-2/menia-report/summary.json
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v2 --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v3 --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v4 --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v5 --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v5-second --replay-lives 2 --check
      - run: python -m research.audit_indicator_agent --root artifacts/indicator-agent-v6 --replay-lives 2 --check
      - run: python -m research.indicator_second_reading --check
      - run: python -m research.indicator_second_reading --root artifacts/indicator-agent-v6 --check
      - run: python scripts/check_reliability_artifacts.py
      - run: python scripts/check_self_model_artifacts.py
      - run: python scripts/audit_self_monitor_information.py
      - run: python scripts/check_temporal_effects.py
      - run: python scripts/check_source_monitor.py
      - run: python -m research.learn_source_policy --out artifacts/learned-verification --check
      - run: python -m research.audit_binding_control --check
      - run: python -m research.audit_active_calibration --check
      - run: python -m research.audit_intrinsic_semantics --check
      - run: python -m research.audit_capacity_planning --check
      - run: python -m research.maintenance_identification --check
      - run: python -m research.audit_self_prediction_controls --check

  human-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-human-research.txt
      - run: python -m unittest discover -s tests_human_research -v

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.2.6
      - run: python -m unittest discover -s tests_workspace -v
      - run: python scripts/check_workspace_artifacts.py

  language-pilot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests_bootstrap -v
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-cross-model.txt
      - run: python -m unittest discover -s tests_language -v
