name: Codemagic fetch

# Relay for a session whose proxy refuses api.codemagic.io: fetches the artefacts
# of the finished builds named in .github/codemagic-fetch.json and pushes them to
# the branch that asked. Needs the repository secret CODEMAGIC_API_TOKEN.
on:
  push:
    paths:
      - .github/codemagic-fetch.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les artefacts Codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
        run: python scripts/codemagic_fetch.py --request .github/codemagic-fetch.json
      - name: Pousser les artefacts sur la branche
        run: |
          git config user.name "codemagic-fetch"
          git config user.email "noreply@github.com"
          git add artifacts
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -q -m "Récupérer les artefacts Codemagic demandés dans .github/codemagic-fetch.json"
          for i in 1 2 3; do
            git pull -q --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
