            mkdir -p "$C" && cp "$A/adapter_config.json" "$C/"
            cp "$A/$(printf %07d $n)_adapters.safetensors" "$C/adapters.safetensors"
            python -m research.llm_mark_reading score --backend mlx --model "$LORA_MODEL" \
              --adapter "$C" --label "$STAGE_REGIME-$((STAGE_BASE + n))" --out "$OUT/reading-$((STAGE_BASE + n))"
            rm -rf "$C"
          done
          python -m research.llm_mark_reading score --backend mlx --model "$LORA_MODEL" --adapter "$A" \
            --label "$STAGE_REGIME-$((STAGE_BASE + LORA_ITERS))" --out "$OUT/reading-$((STAGE_BASE + LORA_ITERS))"
          rm -f "$A"/0*_adapters.safetensors
          git rev-parse HEAD > "$OUT/commit.txt"
    artifacts:
      - llm-lora/**

