workflows:
  menia-check:
    name: Menia - tests et compilation iPhone sans signature
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.2
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Compiler pour iPhone
        script: |
          set -o pipefail
          xcodebuild -project ios/Menia.xcodeproj -scheme Menia -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build.log
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Release-iphoneos/Menia.app ios/Menia-unsigned.app.zip
    artifacts:
      - ios/Menia-unsigned.app.zip
      - ios/build.log

  menia-iphone:
    name: Menia - IPA pour mon iPhone (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.2
      # Upload/fetch the matching certificate and Ad Hoc profile in Codemagic
      # Code signing identities. The profile must contain your iPhone's UDID.
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: ch.menia.local
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Appliquer le profil de signature
        script: xcode-project use-profiles
      - name: Construire l’IPA signée
        script: |
          xcode-project build-ipa --project ios/Menia.xcodeproj --scheme Menia \
            --archive-flags="-skipMacroValidation -destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
