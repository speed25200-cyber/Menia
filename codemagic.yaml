    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        LORA_MODEL: "Qwen/Qwen3-0.6B"
        LORA_ITERS: "750"
        LORA_TRAIN_LIVES: "1500"
        STAGE_REGIME: "VMLB"
        STAGE_START: "artifacts/llm-lora-mac/run-12-full/adapters-FULL-2100"
        STAGE_BASE: "2100"
        LORA_SEED: "17"
    scripts:
      - name: Installer mlx-lm dans un environnement isolé
        script: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "numpy==2.2.6" "mlx-lm==0.31.3" "huggingface_hub>=0.30"
      - name: Vérifier le protocole sur scoreurs simulés
        script: |
          source .venv/bin/activate
          python -m unittest tests_research.test_llm_lora_body tests_research.test_llm_mark_reading -v
      - name: Reprendre l'adaptateur de départ, 750 itérations sur le régime de l'étape, lire à chaque point
        script: |
          set -eo pipefail
          source .venv/bin/activate
          OUT="$CM_BUILD_DIR/llm-lora"
          A="$OUT/adapters-$STAGE_REGIME-$((STAGE_BASE + LORA_ITERS))"
          mkdir -p "$OUT"
          echo "étape $STAGE_REGIME depuis $STAGE_START ($STAGE_BASE itérations), graine $LORA_SEED" | tee "$OUT/stage.txt"
          python -m research.llm_lora_body export --regime "$STAGE_REGIME" --out "$OUT/data-$STAGE_REGIME" \
            --train "$LORA_TRAIN_LIVES" --valid 150 --seed "$LORA_SEED"
          RESUME=""
          if [ "$STAGE_START" != "none" ]; then RESUME="--resume-adapter-file $STAGE_START/adapters.safetensors"; fi
          python -m research.llm_weighted_lora --model "$LORA_MODEL" --train --data "$OUT/data-$STAGE_REGIME" \
            $RESUME --iters "$LORA_ITERS" --batch-size 4 --num-layers 16 --learning-rate 1e-4 \
            --max-seq-length 1024 --steps-per-eval 250 --val-batches 10 --save-every 250 --grad-checkpoint \
            --seed "$LORA_SEED" --adapter-path "$A" 2>&1 | tee "$OUT/lora-$STAGE_REGIME.log" | tail -30
