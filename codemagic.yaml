workflows:
  menia-check:
    name: Menia - tests et compilation iPhone sans signature
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.2
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Compiler pour iPhone
        script: |
          set -o pipefail
          xcodebuild -project ios/Menia.xcodeproj -scheme Menia -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build.log
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Release-iphoneos/Menia.app ios/Menia-unsigned.app.zip
    artifacts:
      - ios/Menia-unsigned.app.zip
      - ios/build.log

  menia-iphone:
    name: Menia - iPhone via TestFlight interne
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: PetMind ASC API
    environment:
      xcode: 26.2
      # Existing Menia App Store profile imported as menia_app_store in Codemagic.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meniaapp.menia
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Appliquer le profil de signature
        script: xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Vérifier la fiche Apple et numéroter le build
        script: python3 ios/prepare_testflight.py
      - name: Construire l’IPA signée
        script: |
          xcode-project build-ipa --project ios/Menia.xcodeproj --scheme Menia \
            --archive-flags="-skipMacroValidation -destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. No external beta review, public release or tester invitations.
        submit_to_testflight: false
        submit_to_app_store: false

  menia-atelier-mac:
    name: Menia - Atelier en contexte sur Mac, mêmes poids que l'iPhone
    instance_type: mac_mini_m2
    max_build_duration: 110
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'atelier-*'
          include: true
    environment:
      vars:
        # Overridable when starting the build: fewer episodes or a single condition.
        ATELIER_EPISODES: "12"
        ATELIER_CONDITIONS: "T-implicit T-explicit C3-implicit C3-explicit"
        ATELIER_MODEL: "Qwen/Qwen3-4B-MLX-4bit"
        ATELIER_REVISION: "52a5ab34fa604bc8af6d3ce0cac0cab10b7eb495"
    scripts:
      - name: Installer mlx-lm dans un environnement isolé
        script: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "numpy==2.2.6" "mlx-lm>=0.24" "huggingface_hub>=0.30"
          python -c "import mlx_lm, platform; print('mlx-lm', getattr(mlx_lm, '__version__', '?'), platform.machine())"
          sysctl -n machdep.cpu.brand_string hw.memsize
      - name: Vérifier le protocole sur répondeurs simulés
        script: |
          source .venv/bin/activate
          python -m unittest tests_research.test_llm_atelier -v
      - name: Exécuter l'Atelier avec Qwen3-4B MLX 4 bits, décodage déterministe
        script: |
          source .venv/bin/activate
          python -m research.llm_atelier --backend mlx \
            --model "$ATELIER_MODEL" --revision "$ATELIER_REVISION" \
            --manifest ios/MeniaCore/Sources/MeniaCore/Resources/qwen3-4b.json \
            --episodes "$ATELIER_EPISODES" --conditions $ATELIER_CONDITIONS \
            --out "$CM_BUILD_DIR/llm-atelier" | tail -60
          git rev-parse HEAD > "$CM_BUILD_DIR/llm-atelier/commit.txt"
    artifacts:
      - llm-atelier/**
