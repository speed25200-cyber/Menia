            --items "${MENIA_REPORT_ITEMS:-artifacts/menia-report/items.jsonl}" --out "$CM_BUILD_DIR/menia-report" | tail -40
          git rev-parse HEAD > "$CM_BUILD_DIR/menia-report/commit.txt"
    artifacts:
