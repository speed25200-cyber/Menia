    artifacts:
      - llm-report/**

  menia-menia-report-mac:
    name: Menia - Menia rapporte l'espace de travail de son agent (Qwen3-4B)
    instance_type: mac_mini_m2
    max_build_duration: 100
    environment:
      vars:
        ATELIER_MODEL: "Qwen/Qwen3-4B-MLX-4bit"
