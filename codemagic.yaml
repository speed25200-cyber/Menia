workflows:
  menia-check:
    name: Menia - tests et compilation iPhone sans signature
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.2
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Compiler pour iPhone
        script: |
          set -o pipefail
          xcodebuild -project ios/Menia.xcodeproj -scheme Menia -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build.log
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Release-iphoneos/Menia.app ios/Menia-unsigned.app.zip
    artifacts:
      - ios/Menia-unsigned.app.zip
      - ios/build.log

  menia-iphone:
    name: Menia - iPhone via TestFlight interne
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: PetMind ASC API
    environment:
      xcode: 26.2
      # Existing Menia App Store profile imported as menia_app_store in Codemagic.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meniaapp.menia
    scripts:
      - name: Tester la mémoire et les mesures de capacités
        script: swift test --package-path ios/MeniaCore
      - name: Préparer le projet
        script: |
          brew install xcodegen
          bash ios/prepare.sh
      - name: Appliquer le profil de signature
        script: xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Vérifier la fiche Apple et numéroter le build
        script: python3 ios/prepare_testflight.py
      - name: Construire l’IPA signée
        script: |
          xcode-project build-ipa --project ios/Menia.xcodeproj --scheme Menia \
            --archive-flags="-skipMacroValidation -destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. No external beta review, public release or tester invitations.
        submit_to_testflight: false
        submit_to_app_store: false
