          python -m unittest tests_research.test_llm_menia_report.MeniaReportTests -v
      - name: Faire rapporter l'espace de travail de l'agent par Qwen3-4B, sans génération
        script: |
          # Second version (docs/MENIA_REPORT_V2_PROTOCOL.md): the relay sets MENIA_REPORT_ITEMS to items-v2.jsonl.
          set -eo pipefail
          source .venv/bin/activate
          python -m research.llm_menia_report score --backend mlx --model "$ATELIER_MODEL" --revision "$ATELIER_REVISION" \
